<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GidWave - Гидросфера</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      border-radius: 0px !important;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #F6F5F0;
      color: #14181D;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .font-serif-editorial {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* Плавные анимации появления и исчезновения при скролле и смене контента */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    .scroll-reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .fade-transition {
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .fade-out-state {
      opacity: 0 !important;
      transform: translateY(8px);
    }

    /* Ползунок годов вплотную к нижней границе карты */
    input[type="range"].aral-flush-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: #283848;
      outline: none;
      cursor: pointer;
      margin: 0;
      padding: 0;
      position: relative;
      z-index: 30;
    }

    input[type="range"].aral-flush-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 26px;
      background: #F6F5F0;
      border: 2px solid #0F3556;
      cursor: grab;
      transition: background-color 0.15s ease;
    }

    input[type="range"].aral-flush-slider::-webkit-slider-thumb:active {
      cursor: grabbing;
      background: #38BDF8;
    }

    input[type="range"].aral-flush-slider::-moz-range-thumb {
      width: 22px;
      height: 26px;
      background: #F6F5F0;
      border: 2px solid #0F3556;
      cursor: grab;
    }

    /* Ползунок громкости видео в футере */
    input[type="range"].video-vol-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 96px;
      height: 4px;
      background: #334155;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].video-vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 16px;
      background: #38BDF8;
      cursor: pointer;
    }

    .photo-slot {
      position: relative;
      background: #1B2A38;
      overflow: hidden;
    }

    .photo-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease, opacity 0.35s ease;
    }

    .photo-slot:hover img {
      transform: scale(1.02);
    }

    .presentation-16-9 {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background: #0D1B2A;
    }

    /* Полноэкранный режим для видео на случай блокировки браузером iframe fullscreen */
    .video-cinema-expanded {
      position: fixed !important;
      inset: 0 !important;
      z-index: 9999 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: #070A0E !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      padding: 20px !important;
    }

    .video-cinema-expanded video {
      max-height: calc(100vh - 100px) !important;
      width: 100% !important;
      object-fit: contain !important;
    }

    canvas {
      display: block;
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#0F3556] selection:text-white">

  <!-- ШАПКА: ТОЛЬКО GidWave И ЯЗЫКИ -->
  <header class="bg-[#F6F5F0]/95 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
      <div class="text-xl font-bold tracking-tight text-[#14181D]">GidWave</div>
      <div class="flex items-center text-sm font-medium gap-1">
        <button onclick="setLanguage('kz')" id="btn-lang-kz" class="px-2.5 py-1 transition-colors">KZ</button>
        <span class="text-neutral-300">/</span>
        <button onclick="setLanguage('ru')" id="btn-lang-ru" class="px-2.5 py-1 transition-colors">RU</button>
        <span class="text-neutral-300">/</span>
        <button onclick="setLanguage('en')" id="btn-lang-en" class="px-2.5 py-1 transition-colors">EN</button>
      </div>
    </div>
  </header>

  <main id="main-content-area" class="flex-grow fade-transition">

    <!-- ТЕМА 1: ОПРЕДЕЛЕНИЕ И ЧТО ИЗ СЕБЯ ПРЕДСТАВЛЯЕТ ГИДРОСФЕРА (ОТКРЫТАЯ ЖУРНАЛЬНАЯ ВЕРСТКА БЕЗ КОРОБОК) -->
    <section class="max-w-6xl mx-auto px-5 sm:px-8 pt-14 pb-24 scroll-reveal">
      <h1 data-i18n="main_title" class="font-serif-editorial text-4xl sm:text-6xl font-semibold tracking-tight text-[#14181D] leading-[1.06] mb-12"></h1>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
        <!-- Левая колонка: открытый авторский текст + цитата + под абзацем о пресной воде три тезиса внизу -->
        <div class="lg:col-span-7 space-y-6 text-base sm:text-lg leading-relaxed text-neutral-800">
          <p data-i18n="def_p1"></p>
          <p data-i18n="def_p2"></p>

          <blockquote class="pl-5 border-l-2 border-[#0F3556] my-8">
            <p data-i18n="def_quote" class="font-serif-editorial italic text-2xl text-[#14181D] leading-snug"></p>
          </blockquote>

          <p data-i18n="def_p3"></p>

          <!-- Три факта сразу под абзацем «На пресную воду остается лишь...» -->
          <div class="pt-6 space-y-8">
            <div class="space-y-2">
              <h3 data-i18n="def_sub_struct" class="font-serif-editorial text-2xl sm:text-3xl font-semibold text-[#14181D]"></h3>
              <p data-i18n="def_struct_p1" class="text-base text-neutral-700 leading-relaxed"></p>
            </div>

            <div class="space-y-2">
              <div class="font-serif-editorial text-3xl font-semibold text-[#0F3556]" data-i18n="def_stat_title"></div>
              <p data-i18n="def_p4" class="text-base text-neutral-700 leading-relaxed"></p>
            </div>

            <div class="space-y-2">
              <div class="font-serif-editorial text-3xl font-semibold text-[#0F3556]" data-i18n="def_renew_title"></div>
              <p data-i18n="def_struct_p2" class="text-base text-neutral-700 leading-relaxed"></p>
            </div>
          </div>
        </div>

        <!-- Правая колонка: фотографии без коробок -->
        <div class="lg:col-span-5 space-y-10 lg:pl-4">
          <div class="photo-slot h-64 sm:h-72">
            <img id="img-theory-1" src="" alt="Hydrosphere Ocean" />
          </div>

          <div class="photo-slot h-60">
            <img id="img-theory-2" src="" alt="Hydrosphere Glaciers" />
          </div>
        </div>
      </div>
    </section>

    <!-- ТЕМА 2: ЭКОЛОГИЧЕСКОЕ СОСТОЯНИЕ ГИДРОСФЕРЫ (БЕЗ КОРОБОК И КАРТОЧЕК) -->
    <section class="max-w-6xl mx-auto px-5 sm:px-8 py-20 scroll-reveal">
      <h2 data-i18n="eco_title" class="font-serif-editorial text-3xl sm:text-5xl font-semibold text-[#14181D] mb-12"></h2>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start mb-16">
        <div class="lg:col-span-4 space-y-3">
          <h3 data-i18n="eco_sub_ext" class="font-serif-editorial text-2xl font-semibold text-[#0F3556]"></h3>
          <p data-i18n="eco_text_ext" class="text-base text-neutral-800 leading-relaxed"></p>
        </div>

        <div class="lg:col-span-4 space-y-3">
          <h3 data-i18n="eco_sub_int" class="font-serif-editorial text-2xl font-semibold text-[#0F3556]"></h3>
          <p data-i18n="eco_text_int" class="text-base text-neutral-800 leading-relaxed"></p>
        </div>

        <div class="lg:col-span-4">
          <div class="photo-slot h-56">
            <img id="img-eco-theory" src="" alt="Ecological state" />
          </div>
        </div>
      </div>

      <!-- Виды загрязнения: открытая двухколоночная типографика без фоновых плашек и без линий -->
      <div class="mt-14">
        <h3 data-i18n="eco_types_heading" class="font-serif-editorial text-2xl sm:text-3xl font-semibold text-[#14181D] mb-10"></h3>
        <div id="pollution-list" class="space-y-8"></div>
        <p data-i18n="eco_outro" class="mt-12 text-lg text-neutral-800 italic font-serif-editorial leading-relaxed max-w-4xl"></p>
      </div>
    </section>

    <!-- ТЕМА 3: ПУТИ РЕШЕНИЯ (1, 2, 3, 4, 5, 6 - ОТКРЫТЫЙ СПИСОК БЕЗ КОРОБОК) -->
    <section class="max-w-6xl mx-auto px-5 sm:px-8 py-20 scroll-reveal">
      <div class="max-w-3xl mb-12">
        <h2 data-i18n="sol_title" class="font-serif-editorial text-3xl sm:text-5xl font-semibold text-[#14181D] mb-4"></h2>
        <p data-i18n="sol_intro" class="text-base sm:text-lg text-neutral-700 leading-relaxed"></p>
      </div>

      <div id="solutions-list" class="space-y-9 max-w-4xl"></div>

      <p data-i18n="sol_examples" class="mt-12 text-base sm:text-lg font-medium text-[#0F3556] leading-relaxed max-w-4xl"></p>
    </section>

    <!-- ГИДРО-ЭКОЛОГИЧЕСКИЙ МОНИТОРИНГ (16:9, ОДНА ФОТОГРАФИЯ) -->
    <section class="py-16 scroll-reveal">
      <div class="max-w-[1380px] mx-auto px-4 sm:px-8">
        <div class="mb-6">
          <h2 data-i18n="pres_title" class="font-serif-editorial text-3xl sm:text-5xl font-semibold text-[#14181D]"></h2>
        </div>

        <div class="presentation-16-9">
          <img
            id="img-monitoring-16-9"
            src="bfc20cec-33c2-4ecc-94de-2b246b0d87e6.jpeg"
            alt="Гидро-экологический мониторинг"
            class="w-full h-full object-cover"
          />
        </div>
      </div>
    </section>

    <!-- ИНТЕРАКТИВ 1: РЕАЛЬНАЯ 3D-КАРТА МИРА С РЕЛЬЕФОМ, СТРАНАМИ И ЯРКИМИ ВОДНЫМИ ОБЪЕКТАМИ -->
    <section class="py-20 scroll-reveal">
      <div class="max-w-6xl mx-auto px-5 sm:px-8">
        <div class="mb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
          <div>
            <h2 data-i18n="int1_title" class="font-serif-editorial text-3xl sm:text-5xl font-semibold text-[#14181D]"></h2>
            <p data-i18n="int1_sub" class="text-sm sm:text-base text-neutral-600 mt-1.5 max-w-2xl"></p>
          </div>
          <button id="world-reset-btn" onclick="resetWorldView()" class="hidden px-5 py-2.5 bg-[#14181D] text-white text-xs font-semibold uppercase tracking-wider hover:bg-[#0F3556] transition-colors shrink-0 self-start sm:self-auto" data-i18n="btn_reset_world"></button>
        </div>

        <div class="relative w-full bg-[#0E3156] overflow-hidden">
          <div class="flex flex-col lg:flex-row w-full min-h-[590px]">

            <!-- Левая панель информации (Мир - чистая журнальная типографика без коробок) -->
            <div id="world-info-box" class="hidden lg:w-5/12 bg-[#F6F5F0] p-6 sm:p-9 flex-col justify-between z-10 fade-transition">
              <div id="world-info-inner" class="space-y-5 fade-transition">
                <h3 id="world-name" class="font-serif-editorial text-3xl sm:text-4xl font-semibold text-[#14181D] leading-tight"></h3>
                <div id="world-location" class="text-sm font-semibold text-[#0F3556]"></div>

                <div class="photo-slot h-48">
                  <img id="world-photo" src="" alt="Water body" />
                </div>

                <p id="world-problem" class="text-sm sm:text-base text-neutral-800 leading-relaxed"></p>
                <p id="world-solution" class="text-sm sm:text-base text-neutral-800 leading-relaxed"></p>
              </div>

              <div class="pt-6 mt-6">
                <button onclick="resetWorldView()" class="px-5 py-2.5 bg-[#14181D] text-white text-xs font-semibold uppercase tracking-wider hover:bg-[#0F3556] transition-colors" data-i18n="btn_reset_world"></button>
              </div>
            </div>

            <!-- Правая область: 3D-карта мира -->
            <div id="world-canvas-wrap" class="w-full lg:w-full h-[550px] sm:h-[590px] relative">
              <canvas id="world-canvas" class="w-full h-full cursor-grab active:cursor-grabbing"></canvas>
              <div id="world-hover-label" class="pointer-events-none fixed hidden px-3.5 py-1.5 bg-[#14181D] text-white text-xs font-semibold tracking-wide z-50"></div>
            </div>

          </div>
        </div>
      </div>
    </section>

    <!-- ИНТЕРАКТИВ 2: ТЕРРИТОРИАЛЬНАЯ 3D-КАРТА КАЗАХСТАНА С ЯРКО ВЫДЕЛЕННЫМИ ВОДОЕМАМИ + 3D АРАЛ -->
    <section class="py-20 scroll-reveal">
      <div class="max-w-6xl mx-auto px-5 sm:px-8">
        <div class="mb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
          <div>
            <h2 data-i18n="int2_title" class="font-serif-editorial text-3xl sm:text-5xl font-semibold text-[#14181D]"></h2>
            <p data-i18n="int2_sub" class="text-sm sm:text-base text-neutral-600 mt-1.5 max-w-2xl"></p>
          </div>
          <button id="kz-reset-btn" onclick="resetKzView()" class="hidden px-5 py-2.5 bg-[#14181D] text-white text-xs font-semibold uppercase tracking-wider hover:bg-[#0F3556] transition-colors shrink-0 self-start sm:self-auto" data-i18n="btn_reset_kz"></button>
        </div>

        <div class="w-full bg-[#C8C0B0] overflow-hidden">
          <div class="flex flex-col lg:flex-row w-full min-h-[590px]">

            <!-- Левая панель информации (Казахстан - без строки "Находится" и без коробок) -->
            <div id="kz-info-box" class="hidden lg:w-5/12 bg-[#F6F5F0] p-6 sm:p-9 flex-col justify-between z-10 fade-transition">
              <div id="kz-info-inner" class="space-y-5 fade-transition">
                <div class="flex items-baseline justify-between gap-4">
                  <h3 id="kz-name" class="font-serif-editorial text-3xl sm:text-4xl font-semibold text-[#14181D] leading-tight"></h3>
                  <span id="kz-aral-year-tag" class="hidden text-xl font-bold text-[#0F3556]">1960</span>
                </div>

                <div class="photo-slot h-48">
                  <img id="kz-photo" src="" alt="Kazakhstan water body" />
                </div>

                <p id="kz-problem" class="text-sm sm:text-base text-neutral-800 leading-relaxed"></p>
                <p id="kz-solution" class="text-sm sm:text-base text-neutral-800 leading-relaxed"></p>
              </div>

              <div class="pt-6 mt-6">
                <button onclick="resetKzView()" class="px-5 py-2.5 bg-[#14181D] text-white text-xs font-semibold uppercase tracking-wider hover:bg-[#0F3556] transition-colors" data-i18n="btn_reset_kz"></button>
              </div>
            </div>

            <!-- Правая область: 3D-карта Казахстана + прижатая снизу шкала годов Арала -->
            <div id="kz-canvas-wrap" class="w-full lg:w-full flex flex-col relative">
              <div id="kz-viewport-box" class="w-full h-[550px] sm:h-[590px] relative">
                <canvas id="kz-canvas" class="w-full h-full cursor-grab active:cursor-grabbing"></canvas>
                <div id="kz-hover-label" class="pointer-events-none fixed hidden px-3.5 py-1.5 bg-[#14181D] text-white text-xs font-semibold tracking-wide z-50"></div>
              </div>

              <!-- Полоска с годами ПРЯМО СНИЗУ КАРТЫ (только для Аральского моря) -->
              <div id="aral-timeline-bar" class="hidden w-full bg-[#14181D] text-[#F6F5F0] px-5 py-4 z-30 select-none">
                <div class="flex items-center justify-between text-xs mb-2">
                  <span data-i18n="aral_timeline_caption" class="text-neutral-300 font-medium"></span>
                  <span id="aral-year-display" class="font-bold text-base text-[#38BDF8]">1960</span>
                </div>
                <input
                  id="aral-slider"
                  type="range"
                  min="0"
                  max="11"
                  step="1"
                  value="0"
                  class="aral-flush-slider"
                />
                <div class="flex justify-between text-[11px] text-neutral-400 mt-2">
                  <button type="button" onclick="setAralStep(0)" class="hover:text-white">1960</button>
                  <button type="button" onclick="setAralStep(1)" class="hover:text-white">1970</button>
                  <button type="button" onclick="setAralStep(2)" class="hover:text-white">1980</button>
                  <button type="button" onclick="setAralStep(3)" class="hover:text-white">1985</button>
                  <button type="button" onclick="setAralStep(4)" class="hover:text-white">1990</button>
                  <button type="button" onclick="setAralStep(5)" class="hover:text-white">1995</button>
                  <button type="button" onclick="setAralStep(6)" class="hover:text-white">2000</button>
                  <button type="button" onclick="setAralStep(7)" class="hover:text-white">2005</button>
                  <button type="button" onclick="setAralStep(8)" class="hover:text-white">2010</button>
                  <button type="button" onclick="setAralStep(9)" class="hover:text-white">2015</button>
                  <button type="button" onclick="setAralStep(10)" class="hover:text-white">2020</button>
                  <button type="button" onclick="setAralStep(11)" class="hover:text-white">2026</button>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ФУТЕР С ВИДЕОПЛЕЕРОМ glo.mp4 И УЧАСТНИКАМИ -->
  <footer class="bg-[#14181D] text-[#F6F5F0] py-16">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 space-y-12">

      <!-- Только экран видео glo.mp4 (со встроенным управлением звуком и полным экраном) -->
      <div class="w-full max-w-4xl mx-auto">
        <video
          id="footer-video"
          src="glo.mp4"
          controls
          playsinline
          preload="metadata"
          class="w-full aspect-video bg-black block"
        ></video>
      </div>

      <!-- Информация о проекте и участниках -->
      <div class="pt-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-8">
        <div>
          <div class="font-bold text-lg mb-1">GidWave</div>
          <p data-i18n="footer_project" class="text-sm text-neutral-300"></p>
        </div>

        <div>
          <div data-i18n="footer_part_heading" class="text-xs uppercase tracking-wider text-neutral-400 mb-2"></div>
          <div id="footer-members" class="flex flex-wrap gap-x-5 gap-y-1 text-sm font-semibold text-white"></div>
        </div>
      </div>

    </div>
  </footer>

  <script>
    // ==========================================
    // НАЗВАНИЯ ФАЙЛОВ ФОТОГРАФИЙ И ВИДЕО (МЕНЯТЬ ЗДЕСЬ)
    // ==========================================
    const PHOTO_FILES = {
      // Видео в футере
      "Видео в футере": "glo.mp4",

      // Главный слайд мониторинга (16:9)
      "Мониторинг (16:9)": "bfc20cec-33c2-4ecc-94de-2b246b0d87e6.jpeg",

      // Фото в теоретических блоках
      "Гидросфера (теория 1)": "hydro_theory_1.jpg",
      "Гидросфера (теория 2)": "hydro_theory_2.jpg",
      "Экология (теория)": "eco_theory.jpg",

      // Карта Мира (10 водных объектов)
      "Саргассово море": "sargasso_sea.jpg",
      "Мексиканский залив": "gulf_of_mexico.jpg",
      "Река Амазонка": "amazon_river.jpg",
      "Большое Соленое озеро": "great_salt_lake.jpg",
      "Река Миссисипи": "mississippi_river.jpg",
      "Мертвое море": "dead_sea.jpg",
      "Озеро Чад": "lake_chad.jpg",
      "Река Ганг": "ganges_river.jpg",
      "Река Янцзы": "yangtze_river.jpg",
      "Большой Барьерный риф": "great_barrier_reef.jpg",

      // Карта Казахстана (9 водных объектов)
      "Аральское море": "IMG_7728.jpeg",

    function bindPhotoFromConfig(imgEl, key) {
      if (!imgEl) return;
      const fileName = PHOTO_FILES[key] || "";
      imgEl.dataset.photoKey = key;
      imgEl.onerror = function () {
        if (this.dataset.fallbackApplied !== "1" && PREVIEW_FALLBACKS[key]) {
          this.dataset.fallbackApplied = "1";
          this.src = PREVIEW_FALLBACKS[key];
        }
      };
      imgEl.dataset.fallbackApplied = "0";
      imgEl.src = fileName;
    }

    function initStaticPhotos() {
      bindPhotoFromConfig(document.getElementById('img-monitoring-16-9'), "Мониторинг (16:9)");
      bindPhotoFromConfig(document.getElementById('img-theory-1'), "Гидросфера (теория 1)");
      bindPhotoFromConfig(document.getElementById('img-theory-2'), "Гидросфера (теория 2)");
      bindPhotoFromConfig(document.getElementById('img-eco-theory'), "Экология (теория)");

      const vEl = document.getElementById('footer-video');
      if (vEl) {
        vEl.src = PHOTO_FILES["Видео в футере"] || "glo.mp4";
        vEl.volume = 0.8;
      }
    }

    // Управление видео glo.mp4 в футере (воспроизведение, звук -/+, полный экран)
    function toggleFooterVideoPlay() {
      const video = document.getElementById('footer-video');
      if (!video) return;
      if (video.paused) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
      updateVideoButtonsState();
    }

    function updateVideoButtonsState() {
      const video = document.getElementById('footer-video');
      if (!video) return;
      const dict = i18n[currentLang];
      const label = video.paused ? dict.video_btn_play : dict.video_btn_pause;
      const btn1 = document.getElementById('footer-video-play-btn');
      const btn2 = document.getElementById('bar-play-label');
      if (btn1) btn1.textContent = label;
      if (btn2) btn2.textContent = label;
    }

    function setFooterVideoVolume(val) {
      const video = document.getElementById('footer-video');
      if (!video) return;
      const clamped = Math.max(0, Math.min(1, parseFloat(val)));
      video.muted = (clamped === 0);
      video.volume = clamped;
      const slider = document.getElementById('footer-video-volume');
      if (slider) slider.value = clamped;
      const readout = document.getElementById('footer-video-vol-Readout');
      if (readout) readout.textContent = Math.round(clamped * 100) + '%';
    }

    function changeFooterVideoVolume(delta) {
      const video = document.getElementById('footer-video');
      if (!video) return;
      const current = video.muted ? 0 : video.volume;
      setFooterVideoVolume(current + delta);
    }

    function openFooterVideoFullscreen() {
      const video = document.getElementById('footer-video');
      const container = document.getElementById('footer-video-container');
      if (!video || !container) return;

      if (video.requestFullscreen) {
        video.requestFullscreen().catch(() => toggleCinemaFallback());
      } else if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
      } else if (container.requestFullscreen) {
        container.requestFullscreen().catch(() => toggleCinemaFallback());
      } else {
        toggleCinemaFallback();
      }
    }

    function toggleCinemaFallback() {
      const container = document.getElementById('footer-video-container');
      const closeBtn = document.getElementById('bar-close-cinema-btn');
      if (!container) return;
      const isExpanded = container.classList.toggle('video-cinema-expanded');
      if (closeBtn) {
        closeBtn.classList.toggle('hidden', !isExpanded);
      }
    }

    function closeCinemaFallback() {
      const container = document.getElementById('footer-video-container');
      const closeBtn = document.getElementById('bar-close-cinema-btn');
      if (container) container.classList.remove('video-cinema-expanded');
      if (closeBtn) closeBtn.classList.add('hidden');
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    /* =========================================================================
       5. ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА И ПЛАВНЫЕ АНИМАЦИИ ПОЯВЛЕНИЯ / ИСЧЕЗНОВЕНИЯ

    let selectedWorldIdx = null;

    function initScrollRevealAnimations() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          } else {
            entry.target.classList.remove('is-visible');
          }
        });
      }, { threshold: 0.12 });

      document.querySelectorAll('.scroll-reveal').forEach(section => {
        observer.observe(section);
      });
    }

    /* =========================================================================
       6. ИНТЕРАКТИВ 1: РЕАЛЬНАЯ 3D-КАРТА МИРА С ФИЗИЧЕСКИМ ЛАНДШАФТОМ И ЯРКИМИ ВОДНЫМИ ОБЪЕКТАМИ
       ========================================================================= */
    let worldScene, worldCamera, worldRenderer, worldGroup, worldCountryMeshGroup;
    let worldClickables = [];
    let worldVisualWaterMeshes = [];
    let worldPulseRings = [];
    const WORLD_DEFAULT_CAM = new THREE.Vector3(0, 14.2, 10.5);
    const WORLD_DEFAULT_LOOK = new THREE.Vector3(0, 0, 0);
    let worldTargetCamPos = WORLD_DEFAULT_CAM.clone();
    let worldTargetLookAt = WORLD_DEFAULT_LOOK.clone();
    let worldCurrentLookAt = WORLD_DEFAULT_LOOK.clone();
    let worldTargetRotY = 0;

    function lonLatToWorldXZ(lon, lat) {
      return [lon / 18.0, -lat / 18.0];
    }

    // Физический 3D-рельеф Земли (горы, нагорья, равнины)
    function getWorldReliefHeight(lon, lat) {
      let h = 0.16;
      // Гималаи, Тибет, Памир, Тянь-Шань
      h += 0.68 * Math.exp(-(Math.pow((lon - 86) / 14, 2) + Math.pow((lat - 33) / 7, 2)));
      h += 0.42 * Math.exp(-(Math.pow((lon - 74) / 10, 2) + Math.pow((lat - 41) / 5, 2)));
      // Анды
      h += 0.56 * Math.exp(-(Math.pow((lon + 70) / 5.5, 2) + Math.pow((lat + 18) / 24, 2)));
      // Кордильеры и Скалистые горы
      h += 0.46 * Math.exp(-(Math.pow((lon + 114) / 10, 2) + Math.pow((lat - 44) / 18, 2)));
      // Альпы, Кавказ, Иранское нагорье
      h += 0.36 * Math.exp(-(Math.pow((lon - 44) / 16, 2) + Math.pow((lat - 38) / 7, 2)));
      h += 0.32 * Math.exp(-(Math.pow((lon - 12) / 7, 2) + Math.pow((lat - 46) / 4, 2)));
      // Восточно-Африканское нагорье и Эфиопия
      h += 0.38 * Math.exp(-(Math.pow((lon - 37) / 8, 2) + Math.pow((lat - 4) / 14, 2)));
      // Небольшая естественная волнистость рельефа
      h += 0.04 * Math.sin(lon * 0.12) * Math.cos(lat * 0.15);
      return h;
    }

    // Естественный физико-географический цвет суши в зависимости от широты и высоты
    function getWorldBiomeColor(lon, lat, elev) {
      const c = new THREE.Color();
      if (elev > 0.62) {
        c.setHex(0xF0F4F8); // Высокогорные снега Гималаев и Анд
      } else if (elev > 0.42) {
        c.setHex(0x8C6D53); // Горные хребты
      } else if (elev > 0.28) {
        c.setHex(0xC2A878); // Плато и возвышенности
      } else {
        // Пояса растительности: пустыни Сахары/Аравии/Австралии vs зеленые леса и равнины
        const isSaharaArabia = (lat > 14 && lat < 33 && lon > -16 && lon < 58);
        const isAusOutback = (lat < -18 && lat > -32 && lon > 116 && lon < 144);
        const isHighNorth = (lat > 62);
        if (isSaharaArabia || isAusOutback) {
          c.setHex(0xD8BE8B); // Песчаные пустыни
        } else if (isHighNorth) {
          c.setHex(0xB8C4B4); // Северная тундра
        } else if (Math.abs(lat) < 14) {
          c.setHex(0x5F8D52); // Влажные экваториальные леса
        } else {
          c.setHex(0x7DA263); // Зеленые умеренные равнины и степи
        }
      }
      return c;
    }

    function initWorld3D() {
      const canvas = document.getElementById('world-canvas');
      const wrap = document.getElementById('world-canvas-wrap');
      if (!canvas) return;

      worldScene = new THREE.Scene();
      worldScene.background = new THREE.Color(0x0E3156);

      const w = wrap.clientWidth || 800;
      const h = wrap.clientHeight || 560;

      worldCamera = new THREE.PerspectiveCamera(38, w / h, 0.1, 120);
      worldCamera.position.copy(WORLD_DEFAULT_CAM);
      worldCamera.lookAt(WORLD_DEFAULT_LOOK);

      worldRenderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      worldRenderer.setSize(w, h);
      worldRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      worldScene.add(new THREE.AmbientLight(0xffffff, 0.85));
      const sun = new THREE.DirectionalLight(0xfff8eb, 0.92);
      sun.position.set(10, 24, 14);
      worldScene.add(sun);

      worldGroup = new THREE.Group();
      worldScene.add(worldGroup);

      // 1. Водная гладь Мирового океана с мягким батиметрическим оттенком
      const oceanGeo = new THREE.PlaneGeometry(23.0, 12.0, 64, 36);
      oceanGeo.rotateX(-Math.PI / 2);
      const oPos = oceanGeo.attributes.position;
      const oCols = [];
      for (let i = 0; i < oPos.count; i++) {
        const ox = oPos.getX(i);
        const oz = oPos.getZ(i);
        const distCenter = Math.hypot(ox / 11.5, oz / 6.0);
        const oc = new THREE.Color().setHSL(0.58, 0.68, Math.max(0.18, 0.27 - distCenter * 0.06));
        oCols.push(oc.r, oc.g, oc.b);
      }
      oceanGeo.setAttribute('color', new THREE.Float32BufferAttribute(oCols, 3));
      const oceanMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.35,
        metalness: 0.12
      });
      worldGroup.add(new THREE.Mesh(oceanGeo, oceanMat));

      const gridHelper = new THREE.GridHelper(22, 22, 0x1D5284, 0x16436E);
      gridHelper.position.y = 0.01;
      gridHelper.scale.z = 0.5;
      worldGroup.add(gridHelper);

      worldCountryMeshGroup = new THREE.Group();
      worldGroup.add(worldCountryMeshGroup);

      // 2. Загружаем реальный GeoJSON всех стран мира с физическим ландшафтом и границами
      loadRealWorldCountriesGeoJSON();

      // 3. Строим 10 ярко выделенных, реалистичных водных объектов мира
      buildWorldWaterObjects();

      setupWorldInteraction(canvas);
    }

    async function loadRealWorldCountriesGeoJSON() {
      try {
        const res = await fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson');
        if (!res.ok) throw new Error('GeoJSON status');
        const geojson = await res.json();
        renderWorldCountriesFromGeoJSON(geojson);
      } catch (e) {
        renderFallbackWorldCountries();
      }
    }

    function renderWorldCountriesFromGeoJSON(geojson) {
      const borderMat = new THREE.LineBasicMaterial({ color: 0x263228, transparent: true, opacity: 0.68 });

      geojson.features.forEach((feature) => {
        if (!feature.geometry) return;
        const name = (feature.properties && feature.properties.name) || '';
        if (name === 'Antarctica') return;

        const polys = feature.geometry.type === 'Polygon'
          ? [feature.geometry.coordinates]
          : feature.geometry.type === 'MultiPolygon'
          ? feature.geometry.coordinates
          : [];

        polys.forEach(poly => {
          const outerRing = poly[0];
          if (!outerRing || outerRing.length < 3) return;

          const shape = new THREE.Shape();
          const borderPts3D = [];

          outerRing.forEach((coord, i) => {
            const [wx, wz] = lonLatToWorldXZ(coord[0], coord[1]);
            if (i === 0) shape.moveTo(wx, -wz);
            else shape.lineTo(wx, -wz);

            const elev = getWorldReliefHeight(coord[0], coord[1]);
            borderPts3D.push(new THREE.Vector3(wx, elev + 0.02, wz));
          });

          try {
            const extrudeGeo = new THREE.ExtrudeGeometry(shape, {
              depth: 0.15,
              bevelEnabled: false
            });
            extrudeGeo.rotateX(-Math.PI / 2);

            const pos = extrudeGeo.attributes.position;
            const vColors = [];
            for (let k = 0; k < pos.count; k++) {
              const py = pos.getY(k);
              const lon = pos.getX(k) * 18.0;
              const lat = -pos.getZ(k) * 18.0;
              const elev = getWorldReliefHeight(lon, lat);
              if (py > 0.05) {
                pos.setY(k, elev);
              }
              const col = getWorldBiomeColor(lon, lat, elev);
              vColors.push(col.r, col.g, col.b);
            }
            extrudeGeo.setAttribute('color', new THREE.Float32BufferAttribute(vColors, 3));
            extrudeGeo.computeVertexNormals();

            const countryMat = new THREE.MeshStandardMaterial({
              vertexColors: true,
              roughness: 0.82,
              metalness: 0.05
            });
            const mesh = new THREE.Mesh(extrudeGeo, countryMat);
            worldCountryMeshGroup.add(mesh);

            const lineGeo = new THREE.BufferGeometry().setFromPoints(borderPts3D);
            const line = new THREE.Line(lineGeo, borderMat);
            worldCountryMeshGroup.add(line);
          } catch (err) {
            // Пропускаем самопересекающиеся микро-острова
          }
        });
      });
    }

    function renderFallbackWorldCountries() {
      const fallbackLand = new THREE.Mesh(
        new THREE.BoxGeometry(16, 0.15, 7),
        new THREE.MeshStandardMaterial({ color: 0x7DA263 })
      );
      worldCountryMeshGroup.add(fallbackLand);
    }

    function buildWorldWaterObjects() {
      worldClickables = [];
      worldVisualWaterMeshes = [];
      worldPulseRings = [];

      worldWaterObjects.forEach((obj, idx) => {
        const [cx, cz] = lonLatToWorldXZ(obj.lon, obj.lat);
        obj.x = cx;
        obj.z = cz;

        // Глубокий сапфирово-кобальтовый цвет с ярким голубым свечением береговой кромки
        const waterMat = new THREE.MeshStandardMaterial({
          color: 0x052659,
          emissive: 0x0EA5E9,
          emissiveIntensity: 0.38,
          roughness: 0.12,
          metalness: 0.3,
          side: THREE.DoubleSide
        });

        const rimLineMat = new THREE.LineBasicMaterial({ color: 0x38BDF8 });

        let visualMesh;
        if (obj.type === 'river' && obj.points) {
          const riverGroup = new THREE.Group();

          const curvePts = obj.points.map(pt => {
            const [px, pz] = lonLatToWorldXZ(pt[0], pt[1]);
            const py = getWorldReliefHeight(pt[0], pt[1]) + 0.055;
            return new THREE.Vector3(px, py, pz);
          });
          const curve = new THREE.CatmullRomCurve3(curvePts);

          // Светлая береговая окантовка русла реки
          const bankGeo = new THREE.TubeGeometry(curve, 44, 0.12, 10, false);
          bankGeo.scale(1, 0.18, 1);
          const bankMat = new THREE.MeshBasicMaterial({ color: 0x38BDF8 });
          riverGroup.add(new THREE.Mesh(bankGeo, bankMat));

          // Главное темно-сапфировое русло поверх окантовки
          const mainChannelGeo = new THREE.TubeGeometry(curve, 44, 0.085, 10, false);
          mainChannelGeo.scale(1, 0.28, 1);
          const mainMesh = new THREE.Mesh(mainChannelGeo, waterMat);
          riverGroup.add(mainMesh);

          // Притоки реки для реалистичной речной сети
          if (obj.tributaries) {
            obj.tributaries.forEach(trib => {
              const tPts = trib.map(pt => {
                const [tx, tz] = lonLatToWorldXZ(pt[0], pt[1]);
                const ty = getWorldReliefHeight(pt[0], pt[1]) + 0.05;
                return new THREE.Vector3(tx, ty, tz);
              });
              const tCurve = new THREE.CatmullRomCurve3(tPts);
              const tGeo = new THREE.TubeGeometry(tCurve, 24, 0.05, 8, false);
              tGeo.scale(1, 0.25, 1);
              riverGroup.add(new THREE.Mesh(tGeo, waterMat));
            });
          }

          visualMesh = mainMesh;
          worldGroup.add(riverGroup);
        } else {
          // Реалистичный силуэт моря / озера / залива с четким светящимся контуром берега
          const shape = new THREE.Shape();
          const rimPts = [];
          const steps = 40;
          const rx = Math.min(0.68, obj.rx || 0.42);
          const rz = Math.min(0.42, obj.rz || 0.30);

          for (let i = 0; i <= steps; i++) {
            const a = (i / steps) * Math.PI * 2;
            const rMod = 1 + 0.14 * Math.sin(a * 3 + idx * 1.7) + 0.08 * Math.cos(a * 5 - idx);
            const sx = Math.cos(a) * rx * rMod;
            const sy = Math.sin(a) * rz * rMod;
            if (i === 0) shape.moveTo(sx, sy);
            else shape.lineTo(sx, sy);
            rimPts.push(new THREE.Vector3(sx, 0.012, -sy));
          }

          const geo = new THREE.ShapeGeometry(shape, 24);
          geo.rotateX(-Math.PI / 2);
          visualMesh = new THREE.Mesh(geo, waterMat);

          const py = getWorldReliefHeight(obj.lon, obj.lat) + 0.055;
          visualMesh.position.set(cx, py, cz);

          const rimGeo = new THREE.BufferGeometry().setFromPoints(rimPts);
          const rimLine = new THREE.Line(rimGeo, rimLineMat);
          visualMesh.add(rimLine);

          worldGroup.add(visualMesh);
        }

        // Деликатное пульсирующее гидрологическое кольцо-маячок, чтобы каждый из 10 объектов сразу замечался на карте
        const beaconGeo = new THREE.RingGeometry(0.14, 0.22, 28);
        beaconGeo.rotateX(-Math.PI / 2);
        const beaconMat = new THREE.MeshBasicMaterial({
          color: 0x38BDF8,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.85
        });
        const beaconMesh = new THREE.Mesh(beaconGeo, beaconMat);
        const by = getWorldReliefHeight(obj.lon, obj.lat) + 0.08;
        beaconMesh.position.set(cx, by, cz);
        worldGroup.add(beaconMesh);
        worldPulseRings.push(beaconMesh);

        visualMesh.userData = { index: idx, baseColor: 0x052659 };
        worldVisualWaterMeshes.push(visualMesh);

        const hitGeo = new THREE.CylinderGeometry(Math.max(0.55, obj.rx || 0.72), Math.max(0.55, obj.rx || 0.72), 0.8, 18);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false });
        const hitMesh = new THREE.Mesh(hitGeo, hitMat);
        hitMesh.position.set(cx, 0.35, cz);
        hitMesh.userData = { index: idx, visualMesh };
        worldGroup.add(hitMesh);
        worldClickables.push(hitMesh);
      });
    }

    function setupWorldInteraction(canvas) {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let isDragging = false;
      let startX = 0, startY = 0;
      let moved = false;

      canvas.addEventListener('mousedown', e => {
        isDragging = true;
        moved = false;
        startX = e.clientX;
        startY = e.clientY;
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        if (isDragging) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
          worldTargetRotY = Math.max(-0.45, Math.min(0.45, worldTargetRotY + dx * 0.004));
          startX = e.clientX;
          startY = e.clientY;
          return;
        }

        raycaster.setFromCamera(mouse, worldCamera);
        const hits = raycaster.intersectObjects(worldClickables);
        const label = document.getElementById('world-hover-label');

        worldVisualWaterMeshes.forEach(m => {
          if (selectedWorldIdx !== m.userData.index) {
            m.material.color.setHex(m.userData.baseColor);
          }
        });

        if (hits.length > 0) {
          const hitObj = hits[0].object;
          const idx = hitObj.userData.index;
          hitObj.userData.visualMesh.material.color.setHex(0x04152B);
          canvas.style.cursor = 'pointer';
          label.textContent = worldWaterObjects[idx][currentLang].name;
          label.style.left = (e.clientX + 14) + 'px';
          label.style.top = (e.clientY + 14) + 'px';
          label.classList.remove('hidden');
        } else {
          canvas.style.cursor = 'grab';
          label.classList.add('hidden');
        }
      });

      canvas.addEventListener('mouseleave', () => {
        document.getElementById('world-hover-label').classList.add('hidden');
      });

      canvas.addEventListener('click', e => {
        if (moved) return;
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, worldCamera);
        const hits = raycaster.intersectObjects(worldClickables);
        if (hits.length > 0) {
          selectWorldWaterObject(hits[0].object.userData.index);
        }
      });
    }

    function selectWorldWaterObject(idx) {
      selectedWorldIdx = idx;
      const obj = worldWaterObjects[idx];

      const infoBox = document.getElementById('world-info-box');
      const infoInner = document.getElementById('world-info-inner');
      const canvasWrap = document.getElementById('world-canvas-wrap');
      const resetBtn = document.getElementById('world-reset-btn');

      infoBox.classList.remove('hidden');
      infoBox.classList.add('flex');
      canvasWrap.className = "w-full lg:w-7/12 h-[550px] sm:h-[590px] relative";
      resetBtn.classList.remove('hidden');

      infoInner.classList.add('fade-out-state');
      setTimeout(() => {
        populateWorldInfo(idx);
        infoInner.classList.remove('fade-out-state');
      }, 150);

      resizeWorldCanvas();
      requestAnimationFrame(resizeWorldCanvas);

      worldTargetRotY = 0;
      worldTargetLookAt.set(obj.x, 0.2, obj.z);
      worldTargetCamPos.set(obj.x * 0.85, 5.0, obj.z + 4.1);

      worldVisualWaterMeshes.forEach(m => {
        const isSel = m.userData.index === idx;
        m.material.color.setHex(isSel ? 0x02132E : m.userData.baseColor);
        m.material.emissiveIntensity = isSel ? 0.75 : 0.38;
      });
    }

    function populateWorldInfo(idx) {
      const obj = worldWaterObjects[idx];
      const data = obj[currentLang];
      const dict = i18n[currentLang];

      document.getElementById('world-name').textContent = data.name;
      document.getElementById('world-location').textContent = dict.label_loc_prefix + data.loc;

      const photoEl = document.getElementById('world-photo');
      bindPhotoFromConfig(photoEl, obj.photoKey);

      document.getElementById('world-problem').innerHTML = `<strong class="text-[#11161C]">${dict.label_prob_prefix}</strong>${data.prob}`;
      document.getElementById('world-solution').innerHTML = `<strong class="text-[#11161C]">${dict.label_sol_prefix}</strong>${data.sol}`;
    }

    function resetWorldView() {
      selectedWorldIdx = null;
      const infoBox = document.getElementById('world-info-box');
      const canvasWrap = document.getElementById('world-canvas-wrap');
      const resetBtn = document.getElementById('world-reset-btn');

      infoBox.classList.add('hidden');
      infoBox.classList.remove('flex');
      canvasWrap.className = "w-full lg:w-full h-[550px] sm:h-[590px] relative";
      resetBtn.classList.add('hidden');

      worldTargetRotY = 0;
      worldTargetLookAt.copy(WORLD_DEFAULT_LOOK);
      worldTargetCamPos.copy(WORLD_DEFAULT_CAM);
      worldVisualWaterMeshes.forEach(m => {
        m.material.color.setHex(m.userData.baseColor);
        m.material.emissiveIntensity = 0.38;
      });

      resizeWorldCanvas();
      requestAnimationFrame(resizeWorldCanvas);
      setTimeout(resizeWorldCanvas, 100);
    }

    function resizeWorldCanvas() {
      const wrap = document.getElementById('world-canvas-wrap');
      if (!wrap || !worldRenderer || !worldCamera) return;
      const rect = wrap.getBoundingClientRect();
      const w = Math.max(300, Math.floor(rect.width));
      const h = Math.max(400, Math.floor(rect.height));
      worldCamera.aspect = w / h;
      worldCamera.updateProjectionMatrix();
      worldRenderer.setSize(w, h, false);
    }

    /* =========================================================================
       7. ИНТЕРАКТИВ 2: ТЕРРИТОРИАЛЬНАЯ 3D-КАРТА КАЗАХСТАНА С ЯРКО ВЫДЕЛЕННЫМИ ВОДОЕМАМИ
       ========================================================================= */
    let kzScene, kzCamera, kzRenderer, kzMainGroup, aralDetailGroup;
    let kzClickables = [];
    let kzVisualWaterMeshes = [];
    let kzPulseRings = [];
    const KZ_DEFAULT_CAM = new THREE.Vector3(0, 12.8, 9.2);
    const KZ_DEFAULT_LOOK = new THREE.Vector3(0, 0, 0);
    let kzTargetCamPos = KZ_DEFAULT_CAM.clone();
    let kzTargetLookAt = KZ_DEFAULT_LOOK.clone();
    let kzCurrentLookAt = KZ_DEFAULT_LOOK.clone();
    let kzTargetRotY = 0;
    let aralTargetRotY = -0.15;
    let isAral3DMode = false;
    let aralWaterMesh, aralWaterGeo;

    function lonLatToKzXZ(lon, lat) {
      return [(lon - 67.0) * 0.42, -(lat - 48.0) * 0.58];
    }

    // Детальный географический контур границы Республики Казахстан (Мангышлак, Бузачи, ЗКО, Север, Алтай, Жетысу, Тянь-Шань, Устюрт)
    const kzAccurateBorderLonLat = [
      [46.5, 48.6], [47.0, 49.8], [48.5, 50.6], [50.2, 51.7], [52.0, 51.6],
      [53.8, 51.3], [55.4, 50.9], [57.5, 51.0], [59.8, 51.8], [61.2, 53.4],
      [62.8, 54.2], [65.2, 54.6], [67.8, 55.1], [69.5, 55.4], [71.2, 54.6],
      [73.4, 54.2], [75.5, 53.9], [77.0, 53.5], [78.6, 52.3], [80.2, 51.4],
      [82.0, 51.1], [84.2, 50.6], [86.5, 49.7], [87.3, 49.1], [86.0, 48.3],
      [85.4, 47.2], [83.5, 46.9], [82.6, 45.6], [80.3, 45.1], [80.5, 43.2],
      [79.3, 42.3], [77.0, 42.7], [74.5, 42.9], [72.2, 42.5], [70.6, 42.1],
      [69.2, 41.3], [68.0, 40.8], [66.3, 41.7], [64.0, 43.0], [61.8, 43.7],
      [59.0, 45.0], [56.0, 45.0], [55.8, 42.8], [54.2, 42.0], [52.5, 41.8],
      [52.4, 43.2], [50.2, 44.4], [51.2, 44.8], [50.8, 45.4], [52.8, 46.2],
      [51.4, 47.1], [49.4, 46.7], [48.2, 47.4], [46.5, 48.6]
    ];

    const neighborBorderLinesLonLat = [
      [[52.5, 41.8], [55.5, 41.2], [58.0, 42.0], [60.2, 41.5], [62.5, 40.2], [66.0, 38.0]],
      [[70.6, 42.1], [71.8, 41.2], [73.2, 40.5], [73.8, 39.8]],
      [[79.3, 42.3], [77.5, 41.2], [75.5, 40.4], [73.8, 39.8]],
      [[87.3, 49.1], [88.5, 49.4], [91.0, 50.0]]
    ];

    function isInsideKzLonLat(lon, lat) {
      let inside = false;
      for (let i = 0, j = kzAccurateBorderLonLat.length - 1; i < kzAccurateBorderLonLat.length; j = i++) {
        const xi = kzAccurateBorderLonLat[i][0], yi = kzAccurateBorderLonLat[i][1];
        const xj = kzAccurateBorderLonLat[j][0], yj = kzAccurateBorderLonLat[j][1];
        const intersect = ((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi + 0.00001) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // Рельеф Казахстана (высота над плато территории РК)
    function getEurasiaKazakhstanRelief(lon, lat) {
      let h = 0.16;

      // Сарыарка (Казахский мелкосопочник) и горы Каркаралы / Улытау
      h += 0.34 * Math.exp(-(Math.pow((lon - 73.0) / 6.0, 2) + Math.pow((lat - 48.8) / 2.4, 2)));
      // Мугоджары
      h += 0.28 * Math.exp(-(Math.pow((lon - 58.5) / 1.8, 2) + Math.pow((lat - 49.2) / 3.2, 2)));
      // Плато Устюрт и хребет Каратау на Мангышлаке
      h += 0.22 * Math.exp(-(Math.pow((lon - 54.5) / 2.8, 2) + Math.pow((lat - 43.6) / 1.8, 2)));
      // Алтай и Саур-Тарбагатай
      h += 1.05 * Math.exp(-(Math.pow((lon - 85.2) / 3.2, 2) + Math.pow((lat - 48.8) / 2.0, 2)));
      // Жетысуский (Джунгарский) Алатау
      h += 0.98 * Math.exp(-(Math.pow((lon - 79.8) / 2.3, 2) + Math.pow((lat - 45.0) / 1.1, 2)));
      // Северный Тянь-Шань (Заилийский Алатау, Хан-Тенгри, Каратау)
      h += 1.32 * Math.exp(-(Math.pow((lon - 77.2) / 4.8, 2) + Math.pow((lat - 42.5) / 1.4, 2)));

      h += 0.025 * Math.sin(lon * 1.4) * Math.cos(lat * 1.6);
      return h;
    }

    function initKz3D() {
      const canvas = document.getElementById('kz-canvas');
      const box = document.getElementById('kz-viewport-box');
      if (!canvas) return;

      kzScene = new THREE.Scene();
      kzScene.background = new THREE.Color(0xC8C0B0);

      const w = box.clientWidth || 800;
      const h = box.clientHeight || 560;

      kzCamera = new THREE.PerspectiveCamera(36, w / h, 0.1, 120);
      kzCamera.position.copy(KZ_DEFAULT_CAM);
      kzCamera.lookAt(KZ_DEFAULT_LOOK);

      kzRenderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      kzRenderer.setSize(w, h);
      kzRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      kzScene.add(new THREE.AmbientLight(0xffffff, 0.86));
      const dir = new THREE.DirectionalLight(0xfff8ea, 0.95);
      dir.position.set(8, 22, 14);
      kzScene.add(dir);

      kzMainGroup = new THREE.Group();
      kzScene.add(kzMainGroup);

      // 1. Фоновая поверхность соседних государств Евразии (спокойный нейтральный тон)
      const neighborPlaneGeo = new THREE.PlaneGeometry(24, 15, 90, 60);
      neighborPlaneGeo.rotateX(-Math.PI / 2);
      const nPos = neighborPlaneGeo.attributes.position;
      for (let i = 0; i < nPos.count; i++) {
        const lon = nPos.getX(i) / 0.42 + 67.0;
        const lat = -nPos.getZ(i) / 0.58 + 48.0;
        nPos.setY(i, getEurasiaKazakhstanRelief(lon, lat) * 0.45);
      }
      neighborPlaneGeo.computeVertexNormals();
      const neighborMat = new THREE.MeshStandardMaterial({
        color: 0xD2CBBF,
        roughness: 0.92,
        metalness: 0.02
      });
      kzMainGroup.add(new THREE.Mesh(neighborPlaneGeo, neighborMat));

      // Тонкие линии границ соседних стран
      const neighborLineMat = new THREE.LineBasicMaterial({ color: 0x968E80 });
      neighborBorderLinesLonLat.forEach(lineCoords => {
        const pts = lineCoords.map(c => {
          const [nx, nz] = lonLatToKzXZ(c[0], c[1]);
          const ny = getEurasiaKazakhstanRelief(c[0], c[1]) * 0.45 + 0.04;
          return new THREE.Vector3(nx, ny, nz);
        });
        const lGeo = new THREE.BufferGeometry().setFromPoints(pts);
        kzMainGroup.add(new THREE.Line(lGeo, neighborLineMat));
      });

      // 2. ВЫДЕЛЕННОЕ 3D-ПЛАТО ТЕРРИТОРИИ КАЗАХСТАНА С ТОЧНЫМ СИЛУЭТОМ СТРАНЫ И ФИЗИЧЕСКИМ РЕЛЬЕФОМ
      const kzShape = new THREE.Shape();
      kzAccurateBorderLonLat.forEach((coord, idx) => {
        const [kx, kz] = lonLatToKzXZ(coord[0], coord[1]);
        if (idx === 0) kzShape.moveTo(kx, -kz);
        else kzShape.lineTo(kx, -kz);
      });

      // Боковой пьедестал территории Казахстана, чтобы силуэт страны выглядел монументально и четко
      const kzPedestalGeo = new THREE.ExtrudeGeometry(kzShape, {
        depth: 0.34,
        bevelEnabled: true,
        bevelThickness: 0.04,
        bevelSize: 0.04,
        bevelSegments: 2
      });
      kzPedestalGeo.rotateX(-Math.PI / 2);
      const kzPedestalMat = new THREE.MeshStandardMaterial({
        color: 0x3D4A3A,
        roughness: 0.75
      });
      kzMainGroup.add(new THREE.Mesh(kzPedestalGeo, kzPedestalMat));

      // Высокодетализированный физический рельеф внутри границ Казахстана
      const kzTopGeo = new THREE.PlaneGeometry(18.5, 10.5, 220, 140);
      kzTopGeo.rotateX(-Math.PI / 2);
      const tPos = kzTopGeo.attributes.position;
      const tCols = [];

      for (let i = 0; i < tPos.count; i++) {
        const vx = tPos.getX(i);
        const vz = tPos.getZ(i);
        const lon = vx / 0.42 + 67.0;
        const lat = -vz / 0.58 + 48.0;
        const inside = isInsideKzLonLat(lon, lat);
        const relief = getEurasiaKazakhstanRelief(lon, lat);

        if (inside) {
          tPos.setY(i, 0.35 + relief);
        } else {
          tPos.setY(i, -0.25); // Скрываем вершины за пределами границы РК под фоном соседей
        }

        const c = new THREE.Color();
        if (!inside) {
          c.setHex(0xD2CBBF);
        } else if (lon < 54.0 && lat > 45.5 && lat < 49.5) {
          c.setHex(0x719F5E); // Прикаспийская низменность
        } else if (relief < 0.26) {
          c.setHex(0x88AB68); // Зеленые лесостепи севера и равнины
        } else if (relief < 0.52) {
          c.setHex(0xD2B77C); // Золотистая степь Сарыарки, Туран и Бетпак-Дала
        } else if (relief < 0.98) {
          c.setHex(0x8F6B4E); // Хребты Алтая, Саур-Тарбагатая и Тянь-Шаня
        } else {
          c.setHex(0xF6F8FB); // Снежные вершины Хан-Тенгри и Белухи
        }
        tCols.push(c.r, c.g, c.b);
      }

      kzTopGeo.setAttribute('color', new THREE.Float32BufferAttribute(tCols, 3));
      kzTopGeo.computeVertexNormals();

      const kzTopMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.8,
        metalness: 0.04
      });
      kzMainGroup.add(new THREE.Mesh(kzTopGeo, kzTopMat));

      // Четкий контур государственной границы Республики Казахстан поверх рельефа
      const kzBorderPts = kzAccurateBorderLonLat.map(coord => {
        const [bx, bz] = lonLatToKzXZ(coord[0], coord[1]);
        const by = 0.38 + getEurasiaKazakhstanRelief(coord[0], coord[1]);
        return new THREE.Vector3(bx, by, bz);
      });
      const kzBorderCurve = new THREE.CatmullRomCurve3(kzBorderPts, true);
      const kzBorderTube = new THREE.TubeGeometry(kzBorderCurve, 260, 0.048, 8, true);
      const kzBorderMat = new THREE.MeshBasicMaterial({ color: 0x11161C });
      kzMainGroup.add(new THREE.Mesh(kzBorderTube, kzBorderMat));

      // 3. ЯРКО И КОНТРАСТНО ВЫДЕЛЕННЫЕ ВОДНЫЕ ОБЪЕКТЫ КАЗАХСТАНА
      buildKzWaterObjects();

      // 4. Детальная 3D-модель Аральского моря
      aralDetailGroup = new THREE.Group();
      aralDetailGroup.visible = false;
      kzScene.add(aralDetailGroup);
      buildDetailedAral3DGroup();

      setupKzInteraction(canvas);
      setupAralSliderEvents();
    }

    function buildKzWaterObjects() {
      kzClickables = [];
      kzVisualWaterMeshes = [];
      kzPulseRings = [];

      kzWaterObjects.forEach((obj, idx) => {
        const [cx, cz] = lonLatToKzXZ(obj.lon, obj.lat);
        obj.x = cx;
        obj.z = cz;

        // Насыщенный глубокий кобальтово-лазурный цвет воды с ярким голубым свечением, чтобы водоемы сразу выделялись на фоне степей и гор
        const waterMat = new THREE.MeshStandardMaterial({
          color: 0x03397A,
          emissive: 0x0EA5E9,
          emissiveIntensity: 0.52,
          roughness: 0.1,
          metalness: 0.32,
          side: THREE.DoubleSide
        });

        const shoreMat = new THREE.MeshBasicMaterial({
          color: 0x38BDF8,
          side: THREE.DoubleSide
        });

        let visualMesh;
        if (obj.type === 'river' && obj.points) {
          const riverGroup = new THREE.Group();

          const curvePts = obj.points.map(pt => {
            const [px, pz] = lonLatToKzXZ(pt[0], pt[1]);
            const py = 0.42 + getEurasiaKazakhstanRelief(pt[0], pt[1]);
            return new THREE.Vector3(px, py, pz);
          });
          const curve = new THREE.CatmullRomCurve3(curvePts);

          // Яркая бирюзово-голубая береговая кайма вокруг реки, чтобы ее было отлично видно издалека
          const bankTube = new THREE.TubeGeometry(curve, 52, 0.21, 10, false);
          bankTube.scale(1, 0.16, 1);
          riverGroup.add(new THREE.Mesh(bankTube, shoreMat));

          // Главное широкое русло реки поверх каймы
          const rGeo = new THREE.TubeGeometry(curve, 52, 0.15, 10, false);
          rGeo.scale(1, 0.28, 1);
          visualMesh = new THREE.Mesh(rGeo, waterMat);
          riverGroup.add(visualMesh);

          kzMainGroup.add(riverGroup);
        } else {
          let shape = new THREE.Shape();

          if (obj.type === 'balkhash_crescent') {
            // Знаменитая серповидная дуга озера Балхаш
            const pts = [
              [-1.25, 0.32], [-0.8, 0.44], [-0.22, 0.28], [0.12, 0.08],
              [0.52, 0.24], [1.08, 0.20], [1.32, 0.0], [1.08, -0.18],
              [0.38, -0.15], [-0.18, -0.24], [-0.75, -0.35], [-1.15, -0.15]
            ];
            shape.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
            shape.closePath();
          } else if (obj.type === 'aral_complex') {
            // Выразительный контур Аральского моря (Северный и Южный бассейны)
            const pts = [
              [-0.55, -0.78], [0.42, -0.84], [0.70, -0.42], [0.24, -0.22],
              [0.78, 0.15], [0.66, 0.78], [-0.12, 0.86], [-0.78, 0.66],
              [-0.86, -0.12], [-0.42, -0.34]
            ];
            shape.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
            shape.closePath();
          } else if (obj.type === 'caspian_basin') {
            // Северо-восточная акватория Каспийского моря с полуостровами Бузачи и Мангышлак
            const pts = [
              [-1.15, -1.45], [0.85, -1.35], [1.10, -0.68], [0.28, -0.32],
              [0.62, 0.24], [-0.18, 0.60], [-0.24, 1.40], [-1.15, 1.50]
            ];
            shape.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
            shape.closePath();
          } else {
            const steps = 32;
            for (let i = 0; i <= steps; i++) {
              const a = (i / steps) * Math.PI * 2;
              const n = 1 + 0.12 * Math.sin(a * 3 + idx);
              const sx = Math.cos(a) * obj.rx * n;
              const sy = Math.sin(a) * obj.rz * n;
              if (i === 0) shape.moveTo(sx, sy);
              else shape.lineTo(sx, sy);
            }
          }

          const py = 0.43 + getEurasiaKazakhstanRelief(obj.lon, obj.lat);

          // Светящаяся береговая кромка вокруг водоема (чуть шире основной глади)
          const shoreGeo = new THREE.ShapeGeometry(shape, 24);
          shoreGeo.rotateX(-Math.PI / 2);
          shoreGeo.scale(1.12, 1, 1.12);
          const shoreMesh = new THREE.Mesh(shoreGeo, shoreMat);
          shoreMesh.position.set(cx, py - 0.012, cz);
          kzMainGroup.add(shoreMesh);

          // Объёмная сапфировая водная гладь озера / моря
          const waterGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.055, bevelEnabled: false });
          waterGeo.rotateX(-Math.PI / 2);
          visualMesh = new THREE.Mesh(waterGeo, waterMat);
          visualMesh.position.set(cx, py, cz);
          kzMainGroup.add(visualMesh);
        }

        // Пульсирующий маркер-маячок над каждым из 9 водных объектов Казахстана
        const ringGeo = new THREE.RingGeometry(0.18, 0.28, 28);
        ringGeo.rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0x38BDF8,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.9
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        const ry = 0.49 + getEurasiaKazakhstanRelief(obj.lon, obj.lat);
        ringMesh.position.set(cx, ry, cz);
        kzMainGroup.add(ringMesh);
        kzPulseRings.push(ringMesh);

        visualMesh.userData = { index: idx, baseColor: 0x03397A };
        kzVisualWaterMeshes.push(visualMesh);

        const hitGeo = new THREE.CylinderGeometry(1.05, 1.05, 0.9, 18);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false });
        const hitMesh = new THREE.Mesh(hitGeo, hitMat);
        hitMesh.position.set(cx, 0.55, cz);
        hitMesh.userData = { index: idx, visualMesh };
        kzMainGroup.add(hitMesh);
        kzClickables.push(hitMesh);
      });
    }

    // 3D-батиметрия котловины Аральского моря
    function getAralBathymetry(x, z) {
      const dNorthMain = Math.hypot((x - 0.3) / 2.3, (z + 2.75) / 1.25);
      const dSaryshyganak = Math.hypot((x - 1.9) / 0.95, (z + 3.6) / 0.75);
      const dWestTrench = Math.hypot((x + 2.25) / 1.15, (z - 1.05) / 2.65);
      const dEastBowl = Math.hypot((x - 1.25) / 2.45, (z - 1.15) / 2.45);
      const dVozrozhdeniya = Math.hypot((x + 0.55) / 0.65, (z - 0.9) / 1.35);

      let bedY = 1.05;
      bedY -= 1.85 * Math.exp(-dNorthMain * dNorthMain * 1.45);
      bedY -= 1.25 * Math.exp(-dSaryshyganak * dSaryshyganak * 1.6);
      bedY -= 2.35 * Math.exp(-dWestTrench * dWestTrench * 1.55);
      bedY -= 1.50 * Math.exp(-dEastBowl * dEastBowl * 1.28);
      bedY += 0.68 * Math.exp(-dVozrozhdeniya * dVozrozhdeniya * 1.8);

      if (z > -1.65 && z < -1.05 && x > -1.6 && x < 1.8) {
        bedY += 0.42 * Math.exp(-Math.pow((z + 1.35) * 4.5, 2));
      }

      bedY += 0.045 * Math.sin(x * 2.8) * Math.cos(z * 2.8) + 0.025 * Math.cos(x * 6.5 + z * 5.2);
      return bedY;
    }

    function buildDetailedAral3DGroup() {
      const bedGeo = new THREE.PlaneGeometry(13.5, 11.5, 170, 145);
      bedGeo.rotateX(-Math.PI / 2);
      const pos = bedGeo.attributes.position;
      const colors = [];

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vz = pos.getZ(i);
        const y = getAralBathymetry(vx, vz);
        pos.setY(i, y);

        const c = new THREE.Color();
        if (y > 0.62) c.setHex(0xB89B6C);
        else if (y > 0.15) c.setHex(0xD8CCB8);
        else if (y > -0.45) c.setHex(0xEAE6DF);
        else c.setHex(0x8899A6);
        colors.push(c.r, c.g, c.b);
      }

      bedGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      bedGeo.computeVertexNormals();

      const bedMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.85,
        metalness: 0.05
      });
      aralDetailGroup.add(new THREE.Mesh(bedGeo, bedMat));

      // Кокаральская плотина
      const damGeo = new THREE.BoxGeometry(2.4, 0.32, 0.14);
      const damMat = new THREE.MeshStandardMaterial({ color: 0x64748B, roughness: 0.6 });
      const damMesh = new THREE.Mesh(damGeo, damMat);
      damMesh.position.set(0.25, 0.08, -1.35);
      aralDetailGroup.add(damMesh);

      aralWaterGeo = new THREE.PlaneGeometry(12.5, 10.5, 135, 115);
      aralWaterGeo.rotateX(-Math.PI / 2);

      const waterMat = new THREE.MeshStandardMaterial({
        color: 0x0F4C81,
        roughness: 0.14,
        metalness: 0.28,
        transparent: true,
        opacity: 0.88
      });

      aralWaterMesh = new THREE.Mesh(aralWaterGeo, waterMat);
      aralDetailGroup.add(aralWaterMesh);
    }

    function updateAral3DWaterSurface(step) {
      if (!aralWaterGeo) return;
      const pos = aralWaterGeo.attributes.position;

      const levelNorth = -0.75 + step.north * 1.12;
      const levelWest  = -1.20 + step.west  * 1.57;
      const levelEast  = -0.52 + step.east  * 0.89;

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vz = pos.getZ(i);

        let targetWaterY;
        if (vz < -1.35) {
          targetWaterY = levelNorth;
        } else {
          const tEast = Math.max(0, Math.min(1, (vx + 0.8) / 1.4));
          targetWaterY = levelWest * (1 - tEast) + levelEast * tEast;
        }

        const bedH = getAralBathymetry(vx, vz);
        if (targetWaterY < bedH - 0.01) {
          pos.setY(i, bedH - 0.08);
        } else {
          pos.setY(i, targetWaterY);
        }
      }

      pos.needsUpdate = true;
      aralWaterGeo.computeVertexNormals();
    }

    function setupAralSliderEvents() {
      const slider = document.getElementById('aral-slider');
      const bar = document.getElementById('aral-timeline-bar');
      if (!slider || !bar) return;

      ['mousedown', 'pointerdown', 'touchstart', 'mousemove', 'pointermove', 'touchmove', 'click'].forEach(evtName => {
        bar.addEventListener(evtName, e => e.stopPropagation());
      });

      slider.addEventListener('input', function(e) {
        e.stopPropagation();
        setAralStep(Number(this.value));
      });

      slider.addEventListener('change', function(e) {
        e.stopPropagation();
        setAralStep(Number(this.value));
      });
    }

    function setAralStep(idx) {
      currentAralStepIdx = Math.max(0, Math.min(aralTimelineSteps.length - 1, Number(idx)));
      const step = aralTimelineSteps[currentAralStepIdx];
      if (!step) return;

      const slider = document.getElementById('aral-slider');
      if (slider && Number(slider.value) !== currentAralStepIdx) {
        slider.value = currentAralStepIdx;
      }

      document.getElementById('aral-year-display').textContent = step.year;
      document.getElementById('kz-aral-year-tag').textContent = step.year;

      if (selectedKzIdx === 0) populateKzInfo(0);
      updateAral3DWaterSurface(step);
    }

    function setupKzInteraction(canvas) {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let isDragging = false;
      let startX = 0, startY = 0;
      let moved = false;

      canvas.addEventListener('mousedown', e => {
        isDragging = true;
        moved = false;
        startX = e.clientX;
        startY = e.clientY;
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        if (isDragging) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;

          if (isAral3DMode) {
            aralTargetRotY = Math.max(-0.75, Math.min(0.75, aralTargetRotY + dx * 0.005));
          } else {
            kzTargetRotY = Math.max(-0.45, Math.min(0.45, kzTargetRotY + dx * 0.004));
          }
          startX = e.clientX;
          startY = e.clientY;
          return;
        }

        if (isAral3DMode) {
          document.getElementById('kz-hover-label').classList.add('hidden');
          return;
        }

        raycaster.setFromCamera(mouse, kzCamera);
        const hits = raycaster.intersectObjects(kzClickables);
        const label = document.getElementById('kz-hover-label');

        kzVisualWaterMeshes.forEach(m => {
          if (selectedKzIdx !== m.userData.index) {
            m.material.color.setHex(m.userData.baseColor);
          }
        });

        if (hits.length > 0) {
          const hitObj = hits[0].object;
          const idx = hitObj.userData.index;
          hitObj.userData.visualMesh.material.color.setHex(0x041630);
          canvas.style.cursor = 'pointer';
          label.textContent = kzWaterObjects[idx][currentLang].name;
          label.style.left = (e.clientX + 14) + 'px';
          label.style.top = (e.clientY + 14) + 'px';
          label.classList.remove('hidden');
        } else {
          canvas.style.cursor = 'grab';
          label.classList.add('hidden');
        }
      });

      canvas.addEventListener('mouseleave', () => {
        document.getElementById('kz-hover-label').classList.add('hidden');
      });

      canvas.addEventListener('click', e => {
        if (moved || isAral3DMode) return;
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, kzCamera);
        const hits = raycaster.intersectObjects(kzClickables);
        if (hits.length > 0) {
          selectKzWaterObject(hits[0].object.userData.index);
        }
      });
    }

    function selectKzWaterObject(idx) {
      selectedKzIdx = idx;
      const obj = kzWaterObjects[idx];

      const infoBox = document.getElementById('kz-info-box');
      const infoInner = document.getElementById('kz-info-inner');
      const canvasWrap = document.getElementById('kz-canvas-wrap');
      const resetBtn = document.getElementById('kz-reset-btn');
      const timelineBar = document.getElementById('aral-timeline-bar');
      const yearTag = document.getElementById('kz-aral-year-tag');

      infoBox.classList.remove('hidden');
      infoBox.classList.add('flex');
      canvasWrap.className = "w-full lg:w-7/12 flex flex-col relative";
      resetBtn.classList.remove('hidden');

      const photoEl = document.getElementById('kz-photo');
      bindPhotoFromConfig(photoEl, obj.photoKey);

      infoInner.classList.add('fade-out-state');
      setTimeout(() => {
        populateKzInfo(idx);
        infoInner.classList.remove('fade-out-state');
      }, 150);

      if (obj.isAral) {
        isAral3DMode = true;
        kzMainGroup.visible = false;
        aralDetailGroup.visible = true;
        aralTargetRotY = -0.18;

        timelineBar.classList.remove('hidden');
        yearTag.classList.remove('hidden');

        kzTargetLookAt.set(0, -0.15, 0);
        kzTargetCamPos.set(0, 8.6, 8.2);
        setAralStep(currentAralStepIdx);
      } else {
        isAral3DMode = false;
        kzMainGroup.visible = true;
        aralDetailGroup.visible = false;
        kzTargetRotY = 0;

        timelineBar.classList.add('hidden');
        yearTag.classList.add('hidden');

        kzTargetLookAt.set(obj.x, 0.35, obj.z);
        kzTargetCamPos.set(obj.x * 0.85, 5.2, obj.z + 4.3);

        kzVisualWaterMeshes.forEach(m => {
          const isSel = m.userData.index === idx;
          m.material.color.setHex(isSel ? 0x021B40 : m.userData.baseColor);
          m.material.emissiveIntensity = isSel ? 0.85 : 0.52;
        });
      }

      resizeKzCanvas();
      requestAnimationFrame(resizeKzCanvas);
      setTimeout(resizeKzCanvas, 100);
    }

    function populateKzInfo(idx) {
      const obj = kzWaterObjects[idx];
      const data = obj[currentLang];
      const dict = i18n[currentLang];

      document.getElementById('kz-name').textContent = data.name;

      if (obj.isAral) {
        const step = aralTimelineSteps[currentAralStepIdx];
        document.getElementById('kz-aral-year-tag').textContent = step.year;
        document.getElementById('kz-problem').innerHTML = `<strong class="text-[#11161C]">${dict.label_prob_prefix}</strong>${step[currentLang]}<br><br>${data.prob}`;
      } else {
        document.getElementById('kz-problem').innerHTML = `<strong class="text-[#11161C]">${dict.label_prob_prefix}</strong>${data.prob}`;
      }

      document.getElementById('kz-solution').innerHTML = `<strong class="text-[#11161C]">${dict.label_sol_prefix}</strong>${data.sol}`;
    }

    function resetKzView() {
      selectedKzIdx = null;
      isAral3DMode = false;

      kzMainGroup.visible = true;
      aralDetailGroup.visible = false;

      document.getElementById('kz-info-box').classList.add('hidden');
      document.getElementById('kz-info-box').classList.remove('flex');
      document.getElementById('aral-timeline-bar').classList.add('hidden');
      document.getElementById('kz-aral-year-tag').classList.add('hidden');
      document.getElementById('kz-reset-btn').classList.add('hidden');
      document.getElementById('kz-canvas-wrap').className = "w-full lg:w-full flex flex-col relative";

      kzTargetRotY = 0;
      kzTargetLookAt.copy(KZ_DEFAULT_LOOK);
      kzTargetCamPos.copy(KZ_DEFAULT_CAM);
      kzVisualWaterMeshes.forEach(m => {
        m.material.color.setHex(m.userData.baseColor);
        m.material.emissiveIntensity = 0.52;
      });

      resizeKzCanvas();
      requestAnimationFrame(resizeKzCanvas);
      setTimeout(resizeKzCanvas, 100);
    }

    function populateKzInfo(idx) {
      const obj = kzWaterObjects[idx];
      const data = obj[currentLang];
      const dict = i18n[currentLang];

      document.getElementById('kz-name').textContent = data.name;

      if (obj.isAral) {
        const step = aralTimelineSteps[currentAralStepIdx];
        document.getElementById('kz-aral-year-tag').textContent = step.year;
        document.getElementById('kz-problem').innerHTML = `<strong class="text-[#11161C]">${dict.label_prob_prefix}</strong>${step[currentLang]}<br><br>${data.prob}`;
      } else {
        document.getElementById('kz-problem').innerHTML = `<strong class="text-[#11161C]">${dict.label_prob_prefix}</strong>${data.prob}`;
      }

      document.getElementById('kz-solution').innerHTML = `<strong class="text-[#11161C]">${dict.label_sol_prefix}</strong>${data.sol}`;
    }

    function resetKzView() {
      selectedKzIdx = null;
      isAral3DMode = false;

      kzMainGroup.visible = true;
      aralDetailGroup.visible = false;

      document.getElementById('kz-info-box').classList.add('hidden');
      document.getElementById('kz-info-box').classList.remove('flex');
      document.getElementById('aral-timeline-bar').classList.add('hidden');
      document.getElementById('kz-aral-year-tag').classList.add('hidden');
      document.getElementById('kz-reset-btn').classList.add('hidden');
      document.getElementById('kz-canvas-wrap').className = "w-full lg:w-full flex flex-col relative";

      kzTargetRotY = 0;
      kzTargetLookAt.copy(KZ_DEFAULT_LOOK);
      kzTargetCamPos.copy(KZ_DEFAULT_CAM);
      kzVisualWaterMeshes.forEach(m => m.material.color.setHex(m.userData.baseColor));

      resizeKzCanvas();
      requestAnimationFrame(resizeKzCanvas);
      setTimeout(resizeKzCanvas, 100);
    }

    function resizeKzCanvas() {
      const box = document.getElementById('kz-viewport-box');
      if (!box || !kzRenderer || !kzCamera) return;
      const rect = box.getBoundingClientRect();
      const w = Math.max(300, Math.floor(rect.width));
      const h = Math.max(400, Math.floor(rect.height));
      kzCamera.aspect = w / h;
      kzCamera.updateProjectionMatrix();
      kzRenderer.setSize(w, h, false);
    }

    /* =========================================================================
       8. АНИМАЦИОННЫЙ ЦИКЛ
       ========================================================================= */
    function animateAll() {
      requestAnimationFrame(animateAll);

      const pulseT = performance.now() * 0.0032;
      const pulseScale = 1 + 0.22 * Math.sin(pulseT);
      const pulseOpacity = 0.55 + 0.35 * Math.cos(pulseT);

      worldPulseRings.forEach(ring => {
        ring.scale.set(pulseScale, 1, pulseScale);
        ring.material.opacity = pulseOpacity;
      });

      kzPulseRings.forEach(ring => {
        ring.scale.set(pulseScale, 1, pulseScale);
        ring.material.opacity = pulseOpacity;
      });

      if (worldRenderer && worldScene && worldCamera) {
        worldCamera.position.lerp(worldTargetCamPos, 0.08);
        worldCurrentLookAt.lerp(worldTargetLookAt, 0.08);
        worldCamera.lookAt(worldCurrentLookAt);
        if (worldGroup) {
          worldGroup.rotation.y += (worldTargetRotY - worldGroup.rotation.y) * 0.1;
        }
        worldRenderer.render(worldScene, worldCamera);
      }

      if (kzRenderer && kzScene && kzCamera) {
        kzCamera.position.lerp(kzTargetCamPos, 0.08);
        kzCurrentLookAt.lerp(kzTargetLookAt, 0.08);
        kzCamera.lookAt(kzCurrentLookAt);
        if (kzMainGroup) {
          kzMainGroup.rotation.y += (kzTargetRotY - kzMainGroup.rotation.y) * 0.1;
        }
        if (aralDetailGroup) {
          aralDetailGroup.rotation.y += (aralTargetRotY - aralDetailGroup.rotation.y) * 0.1;
        }
        kzRenderer.render(kzScene, kzCamera);
      }
    }

    window.addEventListener('resize', () => {
      resizeWorldCanvas();
      resizeKzCanvas();
    });

    window.onload = function () {
      initStaticPhotos();
      applyLanguageContent('ru');
      initScrollRevealAnimations();
      initWorld3D();
      initKz3D();
      animateAll();

      const vEl = document.getElementById('footer-video');
      if (vEl) {
        vEl.addEventListener('play', updateVideoButtonsState);
        vEl.addEventListener('pause', updateVideoButtonsState);
      }
    };
  </script>
